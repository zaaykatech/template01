<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <!-- Include the script that enables Netlify Identity on this page. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      /* Hide Decap CMS watermark */
      a[href^="https://decapcms.org/"],
      a[href^="https://www.netlify.com/"] {
        display: none !important;
      }
      /* Hide Netlify Identity Widget watermark */
      .netlify-identity-menu .netlify-identity-footer,
      #netlify-identity-widget a[href*="netlify"] {
        display: none !important;
      }
      
      /* --- Premium Modern Light Theme --- */
      body, #nc-root {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        background-color: #f8fafc !important;
      }

      /* Typography */
      h1, h2, h3, h4, h5, h6 {
        font-weight: 600 !important;
        color: #0f172a !important;
      }

      /* Soften all box shadows and round all corners to make it look like a modern dashboard */
      div[style*="box-shadow"], 
      div[class*="Card"], 
      div[class*="Panel"] {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03) !important;
        border-radius: 12px !important;
        border: 1px solid #e2e8f0 !important;
      }

      /* Premium Inputs */
      input, select, textarea {
        font-family: 'Inter', sans-serif !important;
        border-radius: 8px !important;
        border: 1px solid #cbd5e1 !important;
        transition: border-color 0.2s, box-shadow 0.2s !important;
      }
      input:focus, select:focus, textarea:focus {
        border-color: #3b82f6 !important;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2) !important;
        outline: none !important;
      }

      /* Premium Buttons */
      button {
        font-family: 'Inter', sans-serif !important;
        border-radius: 8px !important;
        font-weight: 500 !important;
        transition: all 0.2s ease !important;
      }
      button:hover {
        transform: translateY(-1px) !important;
      }

      /* Top App Header styling */
      header[class*="AppHeader"] {
        background-color: #ffffff !important;
        border-bottom: 1px solid #e2e8f0 !important;
        box-shadow: none !important;
      }

      /* --- Responsive Optimizations --- */
      
      /* Mobile View Adjustments */
      @media (max-width: 768px) {
        /* Stack the main layout vertically */
        #nc-root > div > div > main {
          flex-direction: column !important;
        }
        
        /* Make the sidebar full width and remove fixed width restrictions */
        #nc-root aside {
          width: 100% !important;
          max-width: 100% !important;
          border-right: none !important;
          border-bottom: 1px solid #e2e8f0 !important;
          margin-bottom: 1rem !important;
          padding-bottom: 1rem !important;
        }

        /* Make the content area full width */
        #nc-root > div > div > main > div {
          width: 100% !important;
          max-width: 100% !important;
          padding: 0 10px !important;
        }

        /* Adjust the entry editor grid for mobile */
        div[class*="EditorContainer"] {
          padding: 10px !important;
          min-width: auto !important;
        }

        /* Stack control panes */
        div[class*="ControlPane"] {
          width: 100% !important;
          padding: 10px 0 !important;
        }

        /* Make lists/grids single column */
        ul[class*="CardsGrid"] {
          grid-template-columns: 1fr !important;
        }
      }

      /* Desktop View Adjustments */
      @media (min-width: 1024px) {
        /* Let the container take full width so there's no blank space on the right */
        div[class*="EditorContainer"] {
          max-width: 100% !important;
          background: #ffffff !important;
          border-left: 1px solid #e2e8f0 !important;
        }
        /* Center the actual form controls for readability */
        div[class*="ControlPane"] {
          max-width: 900px !important;
          margin: 0 auto !important;
          padding: 40px !important;
        }
      }
      /* Rename "Check for preview" to "Get back to menu website" */
      a[href*="preview"], a[title="Check for preview"] {
        font-size: 0 !important;
      }
      a[href*="preview"]::after, a[title="Check for preview"]::after {
        content: "Get back to menu website";
        font-size: 14px !important;
        display: inline-block;
        visibility: visible;
        color: #3b82f6;
        font-weight: 500;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Netlify Identity widget renders inside an iframe. We must inject CSS directly into the iframe to hide the watermark.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('open', () => {
          setTimeout(() => {
            // Find the actual iframe inside the widget div
            const iframe = document.querySelector('#netlify-identity-widget iframe');
            if (iframe && iframe.contentDocument) {
              const style = iframe.contentDocument.createElement('style');
              style.innerHTML = `
                .netlify-identity-footer, 
                a.netlify-identity-logo,
                a[href*="netlify.com"] { 
                  display: none !important; 
                }
              `;
              iframe.contentDocument.head.appendChild(style);
            }
          }, 100); // slight delay to ensure iframe DOM is ready
        });
      }
    </script>
  </body>
</html>
