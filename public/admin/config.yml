backend:
  name: git-gateway
  branch: main

local_backend: true
media_folder: "public/uploads"
public_folder: "/uploads"

editor:
  preview: false

collections:
  - name: "menu"
    label: "Menu"
    files:
      - file: "content/menu.json"
        name: "menu"
        label: "Restaurant Menu"
        fields:
          - name: "bulk_upload_csv"
            label: "Bulk Upload Menu (Excel/CSV)"
            hint: "Upload an Excel (.xlsx) or CSV file to completely replace the menu below. Columns: Category, Item, Description, Price, Available, Chef's Choice. Click Publish, wait 15 seconds, and refresh the page to see the items."
            widget: "file"
            required: false
          - name: "categories"
            label: "Categories"
            widget: "list"
            summary: '{{fields.title}}'
            fields:
              - {name: "id", label: "Category ID", widget: "string"}
              - {name: "title", label: "Category Title", widget: "string"}
              - {name: "subtitle", label: "Subtitle", widget: "string", required: false}
              - {name: "preheader", label: "Preheader", widget: "string", required: false}
              - {name: "visible", label: "Show Category", widget: "boolean", default: true}
              - name: "items"
                label: "Items"
                widget: "list"
                summary: '{{fields.name}} - {{fields.price}}'
                fields:
                  - {name: "available", label: "Available", widget: "boolean", default: true}
                  - {name: "name", label: "Item Name", widget: "string"}
                  - {name: "description", label: "Description", widget: "text", required: false}
                  - {name: "price", label: "Price", widget: "string"}
                  - {name: "isMostOrdered", label: "Most Ordered", widget: "boolean", default: false, required: false}
                  - {name: "isSignature", label: "Chef's Choice", widget: "boolean", default: false, required: false}
                  - {name: "customTag", label: "Custom Tag", widget: "string", required: false}
                  - {name: "_isSquareMobile", label: "Square on Mobile", widget: "boolean", default: false, required: false}
                  - {name: "_isForcedRectangular", label: "Forced Rectangular", widget: "boolean", default: false, required: false}

  - name: "theme"
    label: "Theme"
    files:
      - file: "content/theme.json"
        name: "theme"
        label: "Website Theme"
        fields:
          - {name: "id", label: "Theme ID", widget: "string"}
          - {name: "name", label: "Theme Name", widget: "select", options: ["Warm Artisan", "Dark Coffee Luxury", "Botanical", "Minimal Editorial", "Terracotta Mediterranean", "Midnight Blue", "Cream & Orange", "Soft Blush", "Forest & Gold", "Custom"]}
          - {name: "description", label: "Description", widget: "string"}
          - {name: "logoUrl", label: "Logo Image", widget: "image", required: false}
          - {name: "showHeroVideo", label: "Show Hero Video", widget: "boolean", default: true, required: false}
          - name: "heroVideoUrl"
            label: "Hero Video Upload"
            widget: "file"
            required: false
            hint: "Please upload an MP4 video UNDER 5MB to save server space. Only change this twice or thrice a year."
          - {name: "instagramUrl", label: "Instagram URL", widget: "string", required: false}
          - {name: "mobileNumber", label: "Mobile Number", widget: "string", required: false}
          - {name: "address", label: "Address", widget: "text", required: false}
          - {name: "reviewUrl", label: "Review URL", widget: "string", required: false}
          - name: "colors"
            label: "Colors"
            widget: "object"
            fields:
              - {name: "background", label: "Background", widget: "color"}
              - {name: "surface", label: "Surface", widget: "color"}
              - {name: "primary", label: "Primary", widget: "color"}
              - {name: "secondary", label: "Secondary", widget: "color"}
              - {name: "accent", label: "Accent", widget: "color"}
              - {name: "text", label: "Text", widget: "color"}
              - {name: "muted", label: "Muted", widget: "color"}
              - {name: "border", label: "Border", widget: "color"}
          - name: "typography"
            label: "Typography"
            widget: "object"
            fields:
              - {name: "heading", label: "Heading Font", widget: "select", options: ["playfair", "inter", "merriweather", "montserrat"]}
              - {name: "body", label: "Body Font", widget: "select", options: ["inter", "roboto", "lato"]}
